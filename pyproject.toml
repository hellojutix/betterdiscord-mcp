[project]
name = "discord-mcp"
version = "0.2.0"
description = "MCP server that collects info from a Discord server via a user account"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "websockets>=12.0",
]

[project.scripts]
discord-mcp = "discord_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["discord_mcp"]
