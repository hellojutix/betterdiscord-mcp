[project]
name = "discord-mcp"
version = "0.5.0"
description = "MCP server that collects info from a Discord server via a user account"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/encryrose/betterdiscord-mcp"
Repository = "https://github.com/encryrose/betterdiscord-mcp"

[project.scripts]
discord-mcp = "discord_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["discord_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
